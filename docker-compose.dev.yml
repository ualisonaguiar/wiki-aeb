services:
  wiki-front-dev:
    image: node:22
    container_name: wiki-dev
    working_dir: /usr/src/app
    ports:
      - 5173:5173
      - 3000:3000
    volumes:
      - ./frontend:/usr/src/app
      - .env:/usr/src/app/.env
    stdin_open: true
    tty: true
    command: sh -c "npm install && npm run dev"

  wiki-mock:
    image: node:22
    container_name: wiki-mock
    working_dir: /usr/src/app
    ports:
      - 4000:4000
    volumes:
      - ./mock:/usr/src/app
    command: sh -c "npm install && npm run mock"
