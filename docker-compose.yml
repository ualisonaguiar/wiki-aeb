services:
  wiki-back-dev:
    image: node:20-alpine
    container_name: wiki-back-dev
    working_dir: /usr/src/app
    ports:
      - 3000:3000
    volumes:
      - ./backend:/usr/src/app
      - .env:/usr/src/app/.env
    env_file:
      - ./.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    stdin_open: true
    tty: true
    command: sh -c "npm install && npm run dev"

  wiki-front-dev:
    image: node:20-alpine
    container_name: wiki-front-dev
    working_dir: /usr/src/app
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/usr/src/app
      - .env:/usr/src/app/.env
    env_file:
      - ./.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - API_PROXY_TARGET=http://wiki-back-dev:3000
    stdin_open: true
    tty: true
    command: sh -c "npm install && npm run dev"
    depends_on:
      - wiki-back-dev
